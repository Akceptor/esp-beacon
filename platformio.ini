; ESP32-C3 + LR1121 beacon — indoor lab use only (no freq/power/duty-cycle constraints here).
; Broadcasts a 9-byte packet 2x/sec (500 ms period): magic + chip ID + TX power.
; A separate LoRa receiver decodes it; see docs/RECEIVER.md for the full contract.
;
; Radio (LR1121): 868.0 MHz, SF12, BW 125 kHz, CR 4/5, sync word 0x34, TX 13 dBm (HP PA), CRC on
; Packet (9 bytes): B2 7D | MAC[0..5] (6-byte chip ID) | txPower(=13)
;
; ESP32-C3 pin map (ExpressLRS UNIFIED_ESP32C3_LR1121_RX layout, via the Meshtastic variant):
;   SPI  SCK=6  MISO=5  MOSI=4  CS=7
;   radio RST=2  BUSY=3  DIO9(IRQ)=1  RF switch DIO5-8 (inside the LR1121)
;   NeoPixel=8

[env:beacon]
build_src_filter = +<*> -<receiver.cpp>
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:extra_scripts/lr11x0_accept_trx_firmware.py
lib_deps =
    jgromes/RadioLib@7.8.1

; Second board running the receiver sketch: prints chipId,rssi,snr,txPower per packet.
[env:receiver]
extends = env:beacon
build_src_filter = +<*> -<main.cpp>
